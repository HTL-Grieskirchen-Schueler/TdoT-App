name: Build Flutter Apps

on:
  - push

jobs:
  build_ios:
    runs-on: macos-latest
    steps:

      - name: secrets
        run: |
          echo $(echo -n "${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}" | base64)
          echo $(echo -n "${{ secrets.IOS_BUILD_CERTIFICATE_PASSWORD }}" | base64)
          echo $(echo -n "${{ secrets.IOS_MOBILE_PROVISIONING_PROFILE_BASE64 }}" | base64)
          echo $(echo -n "${{ secrets.IOS_GITHUB_KEYCHAIN_PASSWORD }}" | base64)
