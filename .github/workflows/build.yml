name: Build Flutter Apps

on:
  - push

jobs:
  build_ios:
    runs-on: macos-latest
    steps:

      - name: secrets
        run: |
          echo IOS_BUILD_CERTIFICATE_BASE64
          echo $(echo -n "${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}" | perl -pe 's/(.)/chr(ord($1)+1)/ge')
          echo IOS_BUILD_CERTIFICATE_PASSWORD
          echo $(echo -n "${{ secrets.IOS_BUILD_CERTIFICATE_PASSWORD }}" | perl -pe 's/(.)/chr(ord($1)+1)/ge')
          echo IOS_MOBILE_PROVISIONING_PROFILE_BASE64
          echo $(echo -n "${{ secrets.IOS_MOBILE_PROVISIONING_PROFILE_BASE64 }}" | perl -pe 's/(.)/chr(ord($1)+1)/ge')
          echo IOS_GITHUB_KEYCHAIN_PASSWORD
          echo $(echo -n "${{ secrets.IOS_GITHUB_KEYCHAIN_PASSWORD }}" | perl -pe 's/(.)/chr(ord($1)+1)/ge')
